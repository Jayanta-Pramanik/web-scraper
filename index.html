<!DOCTYPE html>
<html>
<head>
<title>Smart Product Finder</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI', sans-serif;
}

body{
    background: linear-gradient(135deg,#0f172a,#020617);
    color:white;
}

/* Header */
header{
    padding:20px;
    text-align:center;
    font-size:24px;
    font-weight:bold;
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(10px);
}

/* Container */
.container{
    text-align:center;
    padding:60px 20px;
}

/* Title */
h1{
    font-size:40px;
    margin-bottom:20px;
}

/* Input */
input{
    padding:15px;
    width:300px;
    border:none;
    border-radius:10px;
    outline:none;
}

/* Button */
button{
    padding:15px 25px;
    border:none;
    border-radius:10px;
    margin-left:10px;
    background: linear-gradient(45deg,#22c55e,#4ade80);
    color:white;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform: scale(1.05);
}

/* Cards */
.cards{
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
    margin-top:40px;
}

/* Card */
.card{
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(10px);
    padding:20px;
    border-radius:15px;
    width:220px;
    transition:0.3s;
}

.card:hover{
    transform: translateY(-10px);
}

/* Price */
.price{
    color:#22c55e;
    font-weight:bold;
}

/* Rating */
.rating{
    color:gold;
}

/* Loader */
.loader{
    display:none;
    margin-top:30px;
}

.spinner{
    border:4px solid #333;
    border-top:4px solid #22c55e;
    border-radius:50%;
    width:40px;
    height:40px;
    animation:spin 1s linear infinite;
    margin:auto;
}

@keyframes spin{
    100%{transform:rotate(360deg);}
}
</style>
</head>

<body>

<header>
🚀 Smart Product Finder
</header>

<div class="container">

<h1>Find Best Products Instantly</h1>

<input type="text" id="product" placeholder="Search product...">
<button onclick="search()">Search</button>

<div class="loader" id="loader">
    <div class="spinner"></div>
    <p>Searching products...</p>
</div>

<div class="cards" id="cards"></div>

</div>

<script>
function search(){
    let loader = document.getElementById("loader");
    let cards = document.getElementById("cards");

    cards.innerHTML = "";
    loader.style.display = "block";

    setTimeout(()=>{
        loader.style.display = "none";

        // Fake products
        let data = [
            {title:"Wireless Headphones", price:"₹1999", rating:"4.5⭐"},
            {title:"Smart Watch", price:"₹2499", rating:"4.2⭐"},
            {title:"Bluetooth Speaker", price:"₹1499", rating:"4.4⭐"}
        ];

        data.forEach(item=>{
            let card = `
            <div class="card">
                <h3>${item.title}</h3>
                <p class="price">${item.price}</p>
                <p class="rating">${item.rating}</p>
            </div>
            `;
            cards.innerHTML += card;
        });

    },2000);
}
</script>
<script src="static/script.js"></script>
</body>
</html>
